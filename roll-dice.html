<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/roll dice simulator/input.css" />
  </head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0px;
      padding: 0px;
    }
    .roll-animation {
      animation: roll 0.3s;
      max-height: max-content;
      opacity: 1;
    }
    @keyframes roll {
      0% {
        transform: rotate(0deg) scale(1) skew(0deg);
      }
      25% {
        transform: rotate(90deg) scale(1.2) skew(30deg);
      }
      50% {
        transform: rotate(180deg) scale(0.8) skew(45deg);
      }
      75% {
        transform: rotate(270deg) scale(1.2) skew(30deg);
      }
      100% {
        transform: rotate(360deg) scale(1) skew(0deg);
      }
    }
    #dice {
      width: max-content;
      height: max-content;
      font-size: 100px;
    }
    body {
      margin: 0px;
      display: flex;
      justify-content: center;
      background: linear-gradient(
        to right,
        deepskyblue,
        rgb(4, 108, 220),
        rgb(4, 86, 240),
        rgb(74, 34, 255),
        rgb(39, 20, 241)
      );
    }
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      background: linear-gradient(
        to right,
        deepskyblue,
        rgb(4, 108, 220),
        rgb(4, 86, 240),
        rgb(74, 34, 255),
        rgb(39, 20, 241)
      );
    }
    .container {
      display: flex;
      flex-direction: column;
      width: 50%;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 30px;
      margin: 20px;
      padding: 10px;
      z-index: 1;
      position: relative;
    }
    ul li {
      width: 100px;
      height: 20px;
      padding: 2px;
      margin: 3px auto;
      text-align: center;
    }
    .remains {
      font-size: large;
      color: rgb(67, 67, 67);
      font-weight: bolder;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    #remaining {
      color: crimson;
    }
    h2 {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 32px;
      color: black;
    }
    button {
      padding: 10px 25px;
      font-size: larger;
      font-weight: bolder;
      background-color: deepskyblue;
      border: none;
      border-radius: 10px;
      color: white;
    }
    #result {
      background-color: aliceblue;
      width: 40%;
      text-align: center;
      font-size: large;
      font-weight: bold;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      border-radius: 10px;
    }
    #roll-history li {
      margin-top: 10px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: black;
      width: 200px;
      height: max-content;
      background-color: whitesmoke;
      border-radius: 10px;
      font-size: medium;
      font-weight: bolder;
    }
  </style>
  <body>
    <div id="particles-js"></div>
    <div class="container">
      <h2 class="text-blue">Dice Roll Simulator</h2>

      <div>
        <div id="dice">&#9856;</div>
      </div>

      <button id="roll-btn">Roll</button>
      <p class="remains">Remaining Counts: <span id="remaining">10</span></p>
      <p id="result"></p>

      <ul id="roll-history"></ul>
    </div>
  </body>
  <script src="/roll dice simulator/script.js"></script>
  <script src="particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 150, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: false },
        size: { value: 6, random: true },
        line_linked: {
          enable: true,
          distance: 100,
          color: "#ffffff",
          opacity: 0.6,
          width: 2,
        },
        move: {
          enable: true,
          speed: 10,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out",
        },
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" },
          resize: true,
        },
      },
      retina_detect: true,
    });
  </script>
</html>
